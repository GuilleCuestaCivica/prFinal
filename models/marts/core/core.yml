models:
  - name: fct_movie_calification
    description: "Tabla de hechos que almacena métricas agregadas relacionadas con la calificación de películas a lo largo del tiempo. Esta tabla sigue un enfoque de snapshot para permitir el análisis histórico y actual de popularidad, votos e ingresos."

    columns:
      - name: id_pelicula
        data_type: varchar
        tests:
          - not_null
          - relationships:
              to: ref('dim_movie')
              field: id_pelicula
        description: "Identificador único de la película."

      - name: id_snap
        data_type: varchar
        tests:
          - not_null
          - unique
        description: "Identificador unico de la pelicula ujnto con su id de ingesta para que sea unico"

      - name: snapshot_start
        data_type: date
        tests:
          - not_null
        description: "Fecha de inicio del periodo de validez del snapshot."

      - name: snapshot_end
        data_type: date
        description: "Fecha de fin del periodo de validez del snapshot (puede ser NULL si es el registro actual)."

      - name: popularidad
        data_type: float
        tests:
          - warn_if_nulos_o_cero:
              column_names:
                - popularidad
                - media_votos
                - conteo_votos
                - ingresos
        description: "Métrica de popularidad de la película basada en algoritmos internos o ranking de vistas."

      - name: media_votos
        data_type: float
        description: "Promedio de calificación otorgada por los usuarios a la película."

      - name: conteo_votos
        data_type: number
        description: "Número total de votos recibidos por la película hasta el snapshot."

      - name: ingresos
        data_type: number
        description: "Ingresos acumulados (por ejemplo, en USD) generados por la película hasta el snapshot."

      - name: snapshot_date
        data_type: date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date
        description: "Fecha en la que se tomó el snapshot de los datos."

      - name: is_current
        data_type: boolean
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
        description: "Indicador booleano que señala si el registro es el snapshot más reciente para la película."

  #------------------------------------------------------------------------------------------------------------------------------------------

  - name: genero_pelicula_puente
    description: "Tabla puente que relaciona películas con los géneros a los que pertenecen."

    columns:
      - name: id_pelicula
        data_type: varchar
        tests:
          - not_null
          - relationships:
              to: ref('dim_movie')
              field: id_pelicula
        description: "Identificador de la película (clave foránea a la tabla de películas)."

      - name: id_genero
        data_type: varchar
        tests:
          - not_null
          - relationships:
              to: ref('dim_genero')
              field: id_genero
        description: "Identificador del género (clave foránea a la tabla de géneros)."

  #------------------------------------------------------------------------------------------------------------------------------------------

  - name: director_pelicula_puente
    description: "Tabla puente que relaciona películas con los directores que las han dirigido."

    columns:
      - name: id_pelicula
        data_type: varchar
        description: "Identificador de la película (clave foránea a la tabla de películas)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_movie')
              field: id_pelicula

      - name: id_director
        data_type: varchar
        description: "Identificador del director (clave foránea a la tabla de directores)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_director')
              field: id_director

  #------------------------------------------------------------------------------------------------------------------------------------------

  - name: dim_movie
    description: "Tabla de dimensión que contiene los atributos descriptivos de las películas."
    config:
      contract:
        enforced: true
    columns:
      - name: id_pelicula
        data_type: varchar
        constraints:
          - type: not_null
          - type: unique
        description: "Identificador único de la película."

      - name: titulo
        data_type: varchar
        constraints:
          - type: not_null
        description: "Título principal de la película."

      - name: original_language
        data_type: varchar
        tests:
          - not_null
        description: "Idioma original en el que fue producida la película (ISO 639-1)."

      - name: fecha_estreno
        data_type: date
        tests:
          - not_null
        description: "Fecha oficial de estreno de la película."

      - name: duracion
        data_type: number
        tests:
          - not_null
        description: "Duración de la película en minutos."

      - name: descripcion
        data_type: varchar
        description: "Resumen o sinopsis de la película."

      - name: pais_producion
        data_type: varchar
        description: "País principal donde fue producida la película."

  #------------------------------------------------------------------------------------------------------------------------------------------

  - name: dim_genero
    description: "Tabla de dimensión que contiene los géneros cinematográficos disponibles en el catálogo."

    columns:
      - name: id_genero
        data_type: varchar
        tests:
          - not_null
          - unique
        description: "Identificador único del género."

      - name: nombre_genero
        data_type: varchar
        tests:
          - not_null
          - unique
        description: "Nombre del género (por ejemplo, Comedia, Drama, Acción, etc.)."

  #------------------------------------------------------------------------------------------------------------------------------------------

  - name: dim_director
    description: "Tabla de dimensión que contiene información sobre los directores de películas."

    columns:
      - name: id_director
        data_type: varchar
        tests:
          - not_null
          - unique
        description: "Identificador único del director."

      - name: director
        data_type: varchar
        tests:
          - not_null
          - unique
        description: "Nombre completo del director."

  #------------------------------------------------------------------------------------------------------------------------------------------

  - name: dim_date
    description: "Tabla de dimensión de fechas que descompone cada día en atributos calendario útiles para análisis temporal."

    columns:
      - name: date
        data_type: date
        tests:
          - not_null
          - unique
        description: "Fecha completa en formato calendario (clave primaria de la dimensión)."

      - name: year
        data_type: number
        description: "Año correspondiente a la fecha."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2026

      - name: month
        data_type: number
        description: "Mes numérico correspondiente a la fecha (1-12)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 12

      - name: day
        data_type: number
        description: "Día del mes correspondiente a la fecha (1-31)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 31

      - name: day_of_week
        data_type: number
        description: "Día de la semana como número (0 = Lunes, 6 = Domingo)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 6

      - name: month_name
        data_type: varchar
        description: "Nombre completo del mes correspondiente a la fecha (ej: Enero, Febrero)."
        tests:
          - not_null
          - accepted_values:
              values:
                [
                  "January",
                  "February",
                  "March",
                  "April",
                  "May",
                  "June",
                  "July",
                  "August",
                  "September",
                  "October",
                  "November",
                  "December",
                ]

      - name: day_name
        data_type: varchar
        description: "Nombre del día de la semana (ej: Lunes, Martes)."
        tests:
          - not_null
        #- accepted_values:
        #values: [
        #"Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"
        #]

      - name: is_past
        data_type: boolean
        description: "Indica si la fecha es anterior al día actual (true = fecha pasada)."
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  #------------------------------------------------------------------------------------------------------------------------------------------

  - name: dim_pais
    description: "Dimensión que contiene información demográfica y de preferencias cinematográficas por país."

    columns:
      - name: pais_id
        data_type: varchar
        description: "Identificador único del país."
        tests:
          - not_null
          - unique

      - name: pais_desc
        data_type: varchar
        description: "Nombre descriptivo del país."
        tests:
          - not_null

      - name: genero_favorito
        data_type: varchar
        description: "Género cinematográfico más popular en el país."
        tests:
          - not_null

      - name: genero_menos_visto
        data_type: varchar
        description: "Género cinematográfico con menor visualización en el país."
        tests:
          - not_null

      - name: tendencia_cine
        data_type: varchar
        description: "Tendencia general del consumo de cine en el país (ej: Aumento, Estable, Disminución)."
        tests:
          - not_null

      - name: 0-18_pct
        data_type: float
        description: "Porcentaje de audiencia del país comprendida entre 0 y 18 años."

      - name: 18-24_pct
        data_type: float
        description: "Porcentaje de audiencia del país comprendida entre 18 y 24 años."

      - name: 25-34_pct
        data_type: float
        description: "Porcentaje de audiencia del país comprendida entre 25 y 34 años."

      - name: 35-44_pct
        data_type: float
        description: "Porcentaje de audiencia del país comprendida entre 35 y 44 años."

      - name: 45+_pct
        data_type: float
        description: "Porcentaje de audiencia del país de 45 años o más."

      - name: masculino_pct
        data_type: float
        description: "Porcentaje de audiencia masculina en el país."

      - name: femenino_pct
        data_type: float
        description: "Porcentaje de audiencia femenina en el país."

      - name: otro_pct
        data_type: float
        description: "Porcentaje de audiencia que se identifica con otro género en el país."

  #------------------------------------------------------------------------------------------------------------------------------------------

  - name: dim_actor
    description: "Tabla de dimensión que contiene información sobre los actores presentes en el catálogo de películas."

    columns:
      - name: id_actor
        data_type: varchar
        tests:
          - not_null
          - unique
        description: "Identificador único del actor."

      - name: nombre_actores
        data_type: varchar
        tests:
          - not_null
        description: "Nombre completo del actor o actriz."

#------------------------------------------------------------------------------------------------------------------------------------------

  - name: actor_pelicula_puente
    description: "Tabla puente que relaciona películas con los actores que participaron en ellas."

    columns:
      - name: id_pelicula
        data_type: varchar
        tests:
          - not_null
          - relationships:
              to: ref('dim_movie')
              field: id_pelicula
        description: "Identificador de la película (clave foránea a la tabla de películas)."

      - name: id_actor
        data_type: varchar
        tests:
          - not_null
          - relationships:
              to: ref('dim_actor')
              field: id_actor
        description: "Identificador del actor (clave foránea a la tabla de actores)."
